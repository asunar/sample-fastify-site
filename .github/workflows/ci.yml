name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # openapi.json is committed so API changes surface in review. Regenerating
      # it here fails the build when someone changes a route schema without it.
      - run: npm run generate:openapi
      - run: git diff --exit-code openapi.json
